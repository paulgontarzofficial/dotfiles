# ~/.tmux.conf -- managed in github.com/paulgontarzofficial/dotfiles

# --- General -----------------------------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# --- Reload config: prefix + r -------------------------------------------------
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# --- Panes: prefix + h/j/k/l to move, prefix + H/J/K/L to resize ---------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy mode (vi keys): prefix + Escape to enter, v to select, y to copy -----
setw -g mode-keys vi
set -s set-clipboard on
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind p paste-buffer

# --- Plugins (install with prefix + I) -----------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Keep this line at the very bottom.
run '~/.tmux/plugins/tpm/tpm'
